<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'General Sans'; src: url('../public/fonts/general-sans-700.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'General Sans'; src: url('../public/fonts/general-sans-500.woff2') format('woff2'); font-weight: 500; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center;
    background: #0e0f12; color: #ecedf0; font-family: 'General Sans', system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: 132px; line-height: 0.95; letter-spacing: -0.03em; font-weight: 700; }
  .rule { width: 160px; height: 8px; background: #7b9bff; margin: 40px 0 36px; }
  p { margin: 0; font-size: 48px; line-height: 1.1; font-weight: 500; color: #9aa0ad; }
</style>
<body>
  <h1>Sai Manoj</h1>
  <div class="rule"></div>
  <p>Senior software engineer</p>
</body>
